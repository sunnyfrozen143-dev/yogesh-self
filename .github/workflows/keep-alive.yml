name: Keep Backend Awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf https://yogesh-self-api.onrender.com/api/ && echo "Backend responded" || echo "Ping failed - backend may still be waking up"

